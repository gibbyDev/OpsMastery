version: '3.8'

services:
  auth-service:
    build:
      context: ./auth-service
    ports:
      - "8081:8081"
    env_file:
      - ./auth-service/.env
    depends_on:
      - auth-db
    networks:
      - ops-network

  user-service:
    build:
      context: ./user-service
    ports:
      - "8082:8082"
    env_file:
      - ./user-service/.env
    depends_on:
      - user-db
    networks:
      - ops-network

  ticket-service:
    build:
      context: ./ticket-service
    ports:
      - "8083:8083"
    env_file:
      - ./ticket-service/.env
    depends_on:
      - ticket-db
    networks:
      - ops-network

  auth-db:
    image: postgres:latest
    environment:
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_password
      POSTGRES_DB: auth_db
    networks:
      - ops-network

  user-db:
    image: postgres:latest
    environment:
      POSTGRES_USER: user_user
      POSTGRES_PASSWORD: user_password
      POSTGRES_DB: user_db
    networks:
      - ops-network

  ticket-db:
    image: postgres:latest
    environment:
      POSTGRES_USER: ticket_user
      POSTGRES_PASSWORD: ticket_password
      POSTGRES_DB: ticket_db
    networks:
      - ops-network

networks:
  ops-network:
    driver: bridge